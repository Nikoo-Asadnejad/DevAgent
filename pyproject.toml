[project]
name = "devagent"
version = "0.1.0"
description = "Turn a GitHub issue into an implemented draft pull request"
readme = "README.md"
authors = [
    { name = "nikoo", email = "nikoo.a.14@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "openhands-sdk>=1.49.6",
    "openhands-workspace>=1.49.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
devagent = "devagent.main:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["src", "tests"]
strict = ["src/devagent"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
